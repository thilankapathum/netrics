<div class="flex flex-col gap-3">
  <nav class="flex flex-row flex-wrap gap-3 items-center">
    <div class="breadcrumbs text-xs text-secondary grow-1">
      <ul>
        <li><a routerLink="/">Home</a></li>
        <li class="font-bold">Site Parameters</li>
      </ul>
    </div>
  </nav>

  <section class="bg-base-100 border border-base-300 rounded-xl p-5 w-full max-w-3xl">
    <h1 class="text-base font-semibold">Find a site</h1>
    <p class="text-xs text-secondary mt-0.5">View and edit sectors, antennas and electrical tilts for a site.</p>

    <label class="input input-bordered w-full mt-4">
      <svg class="w-4 h-4 text-secondary shrink-0" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
           stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 21l-4.35-4.35M19 11a8 8 0 1 1-16 0 8 8 0 0 1 16 0Z"/>
      </svg>
      <input type="search" class="grow" autofocus
             placeholder="Site code or name, e.g. KYAMP8"
             aria-label="Search sites"
             role="combobox" aria-controls="site-results" [attr.aria-expanded]="query().length > 1"
             [attr.aria-activedescendant]="activeIndex() >= 0 ? 'site-opt-' + activeIndex() : null"
             [ngModel]="query()"
             (input)="onSearch($any($event.target).value)"
             (keydown)="onKeydown($event)"/>
      <span *ngIf="searching()" class="loading loading-spinner loading-xs text-secondary"></span>
    </label>

    <p *ngIf="query().length === 1" class="text-xs text-secondary mt-3">Type one more character to search.</p>

    <ul *ngIf="query().length > 1 && results().length > 0" id="site-results" role="listbox"
        class="mt-3 border border-base-300 rounded-xl divide-y divide-base-300 max-h-96 overflow-y-auto">
      <li *ngFor="let site of results(); let i = index"
          [id]="'site-opt-' + i" role="option" [attr.aria-selected]="i === activeIndex()"
          class="flex items-baseline gap-3 px-3 py-2 cursor-pointer hover:bg-primary/5"
          [ngClass]="{'bg-primary/10': i === activeIndex()}"
          (mouseenter)="activeIndex.set(i)"
          (click)="selectSite(site)">
        <span class="font-semibold tabular-nums w-24 shrink-0" [class.text-primary]="i === activeIndex()">{{ site.siteCode }}</span>
        <span class="text-secondary truncate">{{ site.siteName }}</span>
      </li>
    </ul>

    <p *ngIf="query().length > 1 && !searching() && searched() && results().length === 0" class="text-xs text-secondary mt-3">
      No site matches “{{ query() }}”. Check the code or try part of the site name.
    </p>
  </section>
</div>
