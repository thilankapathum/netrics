<!--<p>kpi-map works!</p>-->
<div class="flex flex-col gap-3">
  <div>
    <nav class="flex flex-row flex-wrap gap-2 space-x-4 items-center">
      <div class="breadcrumbs text-xs text-secondary grow-1">
        <ul>
          <li><a routerLink="/">
            <svg class="text-base-300" width="14" height="14" viewBox="0 0 24 24" fill="none"
                 xmlns="http://www.w3.org/2000/svg">
              <path
                d="M20 17.0002V11.4522C20 10.9179 19.9995 10.6506 19.9346 10.4019C19.877 10.1816 19.7825 9.97307 19.6546 9.78464C19.5102 9.57201 19.3096 9.39569 18.9074 9.04383L14.1074 4.84383C13.3608 4.19054 12.9875 3.86406 12.5674 3.73982C12.1972 3.63035 11.8026 3.63035 11.4324 3.73982C11.0126 3.86397 10.6398 4.19014 9.89436 4.84244L5.09277 9.04383C4.69064 9.39569 4.49004 9.57201 4.3457 9.78464C4.21779 9.97307 4.12255 10.1816 4.06497 10.4019C4 10.6506 4 10.9179 4 11.4522V17.0002C4 17.932 4 18.3978 4.15224 18.7654C4.35523 19.2554 4.74432 19.6452 5.23438 19.8482C5.60192 20.0005 6.06786 20.0005 6.99974 20.0005C7.93163 20.0005 8.39808 20.0005 8.76562 19.8482C9.25568 19.6452 9.64467 19.2555 9.84766 18.7654C9.9999 18.3979 10 17.932 10 17.0001V16.0001C10 14.8955 10.8954 14.0001 12 14.0001C13.1046 14.0001 14 14.8955 14 16.0001V17.0001C14 17.932 14 18.3979 14.1522 18.7654C14.3552 19.2555 14.7443 19.6452 15.2344 19.8482C15.6019 20.0005 16.0679 20.0005 16.9997 20.0005C17.9316 20.0005 18.3981 20.0005 18.7656 19.8482C19.2557 19.6452 19.6447 19.2554 19.8477 18.7654C19.9999 18.3978 20 17.932 20 17.0002Z"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Home
          </a></li>
          <!--        <li><a routerLink="/pulse">Worst Cell Analysis</a></li>-->
          <li class=" font-bold">Spatial Analysis</li>
        </ul>
      </div>
      <div>
        <div class="tabs tabs-box tabs-xs border border-base-300">
          @for (r of rats; track r.name) {
            <input [disabled]="loadingAll()" type="radio" name="rat_tabs" class="tab" [attr.value]="r.name"
                   [attr.aria-label]="r.label"
                   [checked]="rat() === r.name" (change)="setRat($any($event.target).value)"/>
          }
        </div>
      </div>

      <div class="flex flex-row join">
        <select [disabled]="loadingAll() " class="select select-sm border join-item w-auto" [(ngModel)]="areaType"
                (change)="selectAreaType(areaType()!)">
          @for (at of areaTypes; track at.name) {
            <option [value]="at.name">{{ at.name }}</option>
          }
        </select>
        <select [disabled]="loadingAll() " class="select select-sm border join-item w-auto" [(ngModel)]="area"
                (change)="selectArea(area()!)">
          @for (ar of areas; track ar.name) {
            <option [value]="ar.name">{{ ar.name }}</option>
          }
        </select>
      </div>
      <div class="tabs tabs-box tabs-xs border border-base-300">
        <input [disabled]="loadingAll()" type="radio" name="granularity_tabs"
               class="tab text-primary hover:text-primary/80" value="day-average"
               aria-label="Day Average"
               [checked]="granularity() === 'day-average'"
               (change)="setGranularity($any($event.target).value)"/>
        <input [disabled]="loadingAll()" type="radio" name="granularity_tabs" class="tab text-error hover:text-error/70"
               value="busy-hour"
               aria-label="Busy Hour"
               [checked]="granularity() === 'busy-hour'"
               (change)="setGranularity($any($event.target).value)"/>
      </div>
      <div>
        <select [disabled]="loadingAll()" class="select select-sm ml-auto" [(ngModel)]="standardKpi"
                (change)="selectKpi(standardKpi()!, rat()!, granularity()!)">
          @for (kpi of standardKpis; track $index) {
            <option [value]="kpi.kpiName">{{ kpi.label }}</option>
          }
        </select>
      </div>
      <div class="flex flex-row gap-2 items-center">
        <button #startDateBtn
                class="input input-bordered input-sm w-auto"
                popovertarget="cally-popover-start" id="cally-start"
                style="anchor-name:--cally-start">
          <svg class="text-secondary" width="14" height="14" viewBox="0 0 24 24" fill="none"
               xmlns="http://www.w3.org/2000/svg">
            <path
              d="M4 8H20M4 8V16.8002C4 17.9203 4 18.4801 4.21799 18.9079C4.40973 19.2842 4.71547 19.5905 5.0918 19.7822C5.5192 20 6.07899 20 7.19691 20H16.8031C17.921 20 18.48 20 18.9074 19.7822C19.2837 19.5905 19.5905 19.2842 19.7822 18.9079C20 18.4805 20 17.9215 20 16.8036V8M4 8V7.2002C4 6.08009 4 5.51962 4.21799 5.0918C4.40973 4.71547 4.71547 4.40973 5.0918 4.21799C5.51962 4 6.08009 4 7.2002 4H8M20 8V7.19691C20 6.07899 20 5.5192 19.7822 5.0918C19.5905 4.71547 19.2837 4.40973 18.9074 4.21799C18.4796 4 17.9203 4 16.8002 4H16M8 4H16M8 4V2M16 4V2M11.75 16C11.8881 16 12 15.8881 12 15.75V12.25C12 12.1119 11.8881 12 11.75 12H8.25C8.11193 12 8 12.1119 8 12.25V15.75C8 15.8881 8.11193 16 8.25 16H11.75Z"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>

          {{ date() || 'Pick a date' }}
        </button>

        <div popover
             id="cally-popover-start" class="dropdown bg-base-100 rounded-box shadow-lg"
             style="position-anchor:--cally-start">
          <calendar-date class="cally bg-base-100 border border-base-300 shadow-lg rounded-box"
                         (change)="onDateChange($event)">
            <svg aria-label="Previous" class="fill-current w-4 h-4" slot="previous" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24">
              <path d="M15.75 19.5 8.25 12l7.5-7.5"></path>
            </svg>
            <svg aria-label="Next" class="fill-current w-4 h-4" slot="next" xmlns="http://www.w3.org/2000/svg"
                 viewBox="0 0 24 24">
              <path d="m8.25 4.5 7.5 7.5-7.5 7.5"></path>
            </svg>
            <calendar-month></calendar-month>
          </calendar-date>
        </div>
      </div>
    </nav>
  </div>
  <section>
    <div class="grid sm:grid-cols-[1fr_240px] gap-2 p-2 border border-base-300 rounded-xl bg-base-100">
      <app-sector-map [ratName]="rat()!" [granularityName]="granularity()!"
                      [standardKpiName]="standardKpi()!" [date]="date()!"
                      [mapCellThrSetAndThresholds]="mapCellThrSetAndThresholds"
                      [areaName]="area()!"
                      [loadingAll]="loadingAll()"></app-sector-map>

      <app-cell-map-legend [mapCellThrSetAndThresholds]="mapCellThrSetAndThresholds"
                           [standardKpiLabel]="extractStandardKpiLabel(standardKpi()!)"
                           [isAdmin]="isAdmin()"
                           (isAdminChange)="onLegendTypeChange($event)"
                           [isThresholdAvailable]="isThresholdAvailable"
                           (openCellMapLegendEditModal)="openCellMapLegendEditModal()"
                           [isThresholdEditable]="isThresholdsEditable()"
                           [isThresholdsCustomizable]="isThresholdsCustomizable()"></app-cell-map-legend>
    </div>
  </section>
</div>

<app-cell-map-legend-edit [open]="showCellMapLegendEditModal" (save)="saveThrSetAndThresholds($event)"
                          (closed)="closeCellMapLegendEditModal()"
                          [mapCellThrSetAndThresholds]="mapCellThrSetAndThresholds" [ratName]="rat()!"
                          [granularityName]="granularity()!" [standardKpiName]="standardKpi()!" [isAdmin]="isAdmin()"
                          [savingThresholds]="savingThresholds"></app-cell-map-legend-edit>
