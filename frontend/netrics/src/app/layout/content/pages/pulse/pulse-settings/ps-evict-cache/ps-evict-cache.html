<div class="w-full max-w-4xl flex flex-col gap-6">

  <!-- Page Header -->
  <div>
    <h2 class="text-xl font-semibold text-base-content">Cache Management</h2>
    <p class="text-xs text-secondary mt-1">Manage system data caches by RAT and granularity, or perform a full cache purge.</p>
  </div>

  <!-- Main Settings Card -->
  <div class="card bg-base-100 border border-base-300 p-6 rounded-lg">
    <h3 class="text-lg font-semibold mb-6">Evict Cache Parameters</h3>

    <div class="grid grid-cols-1 sm:grid-cols-[160px_auto] gap-6 items-center">

      <!-- RAT Selection -->
      <div class="font-medium text-xs">RAT</div>
      <div class="tabs tabs-box tabs-xs border border-base-300 w-fit">
        @for (_rat of rats; track $index) {
          <input type="radio" name="rat_tabs" class="tab" [value]="_rat.name" aria-label="{{_rat.label}}"
                 [checked]="rat() === _rat.name" (change)="selectRat($any($event.target).value)"/>
        }
      </div>

      <!-- Evict by Granularity Toggle -->
      <div class="font-medium text-xs">Evict by Granularity</div>
      <div>
        <input type="checkbox" class="toggle toggle-sm toggle-primary" [(ngModel)]="isEvictByGranularity"/>
      </div>

      <!-- Granularity Selection (Conditional) -->
      @if (isEvictByGranularity()) {
        <div class="font-medium text-xs">Granularity</div>
        <div class="tabs tabs-box tabs-xs border border-base-300 w-fit">
          @for (gran of granularities; track gran.name) {
            <input type="radio" name="granularity_tabs" class="tab" [value]="gran.name"
                   aria-label="{{gran.label}}"
                   [checked]="granularity() === gran.name"
                   (change)="selectGranularity($any($event.target).value)"/>
          }
        </div>
      }

    </div>

    <!-- Action Buttons Divider -->
<!--    <div class="divider my-8"></div>-->

    <!-- Actions Section -->
    <div class="flex flex-wrap items-center justify-between gap-4 mt-8">
      <div class="flex w-full items-center">

        <!-- Evict Target Button -->
        <button
          [disabled]="evictingCache || !hasAnyRole(['PULSE_CREATE'])"
          class="btn btn-primary btn-outline btn-sm" (click)="evictCaches()">
          @if (evictingCache) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14 10V17M10 10V17M6 6V17.8C6 18.9201 6 19.4798 6.21799 19.9076C6.40973 20.2839 6.71547 20.5905 7.0918 20.7822C7.5192 21 8.07899 21 9.19691 21H14.8031C15.921 21 16.48 21 16.9074 20.7822C17.2837 20.5905 17.5905 20.2839 17.7822 19.9076C18 19.4802 18 18.921 18 17.8031V6M6 6H8M6 6H4M8 6H16M8 6C8 5.06812 8 4.60241 8.15224 4.23486C8.35523 3.74481 8.74432 3.35523 9.23438 3.15224C9.60192 3 10.0681 3 11 3H13C13.9319 3 14.3978 3 14.7654 3.15224C15.2554 3.35523 15.6447 3.74481 15.8477 4.23486C15.9999 4.6024 16 5.06812 16 6M16 6H18M18 6H20" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>

          }
          Evict Caches
        </button>

        <!-- Evict All Button -->
        <button
          [disabled]="evictingAllCaches || !hasAnyRole(['PULSE_CREATE'])"
          class="ml-auto btn btn-error btn-outline btn-sm" (click)="evictAllCaches()">
          @if (evictingAllCaches) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 8.4502V12.4502M12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 7.02944 21 12C21 16.9706 16.9706 21 12 21ZM12.0498 15.4502V15.5502L11.9502 15.5498V15.4502H12.0498Z" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          }
          Evict All Caches
        </button>

      </div>
    </div>

  </div>
</div>
