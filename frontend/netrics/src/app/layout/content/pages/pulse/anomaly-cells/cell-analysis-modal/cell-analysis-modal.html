<dialog #cellMapCellAnalysisModal id="cell_map_cell_analyse_modal" [class.modal-open]="open()" class="modal w-full ">
  <div class="modal-box max-w-6xl border border-base-300">

    <div class="flex flex-row gap-2 flex-wrap mb-2">
      <h3 class="text-lg font-bold"> {{ cellName() }}</h3>
      <div class="tabs tabs-box tabs-xs ml-auto">
        <input [disabled]="loadingAll()" type="radio" name="period_tabs_analysis_modal" class="tab"
               aria-label="Week (hourly)"
               [(ngModel)]="trendPeriod" [value]="'week'"
               (ngModelChange)="onPeriodChange($event)"/>
        <input [disabled]="loadingAll()" type="radio" name="period_tabs_analysis_modal" class="tab" aria-label="Month"
               checked="checked"
               [(ngModel)]="trendPeriod"
               [value]="'month'" (ngModelChange)="onPeriodChange($event)"/>
        <input [disabled]="loadingAll()" type="radio" name="period_tabs_analysis_modal" class="tab" aria-label="Quarter"
               [(ngModel)]="trendPeriod"
               [value]="'quarter'" (ngModelChange)="onPeriodChange($event)"/>
      </div>
    </div>

    @if (loadingChart) {
      <div class="flex w-full flex-col gap-4 mt-2 mb-2">
        <div class="skeleton h-84 w-full"></div>
      </div>
    }

<!--    <app-linechart [hidden]="loadingChart" [chartSeries]="chartSeries"></app-linechart>-->
    <app-linechart
      [hidden]="loadingChart"
      [chartSeries]="chartSeries"
      [yaxisOverride]="modalYAxis">
    </app-linechart>


    <div class="modal-action">
      <label [hidden]="!standardRawKpiMappingAvailable()" class="label mr-auto">
        <input [disabled]="loadingAll()" type="checkbox" class="checkbox" [ngModel]="showOperands()" (ngModelChange)="onShowOperandsChangeModal($event)" />
        Show Operands
      </label>
      <form class="flex flex-row gap-2">
        <a class="btn btn-outline btn-primary btn-sm" (click)="onCellNavigate()" [routerLink]="getRouterLinkForCell()">
          Cell Analysis
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M9 5L16 12L9 19" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                  stroke-linejoin="round"/>
          </svg>
        </a>
        <button class="btn btn-sm" type="button" (click)="onCancel()">
          Close
          <span class="text-secondary">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M21 21L12 12M12 12L3 3M12 12L21.0001 3M12 12L3 21.0001" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </span>
        </button>
      </form>
    </div>
  </div>
</dialog>
