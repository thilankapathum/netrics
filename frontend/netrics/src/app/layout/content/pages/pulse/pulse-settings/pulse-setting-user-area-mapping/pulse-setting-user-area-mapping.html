<div class="w-full max-w-4xl flex flex-col gap-6">

  <!-- Page Header -->
  <div>
    <h2 class="text-2xl font-bold">User-Area Mapping</h2>
    <p class="text-sm text-base-content/70 mt-1">Assign system users to specific geographical areas or operational zones.</p>
  </div>

  <!-- Main Settings Card -->
  <div class="card bg-base-100 border border-base-300 shadow-sm p-6">
    <h3 class="text-lg font-bold mb-6">Map User to an Area</h3>

    <div class="grid grid-cols-1 sm:grid-cols-[160px_auto] gap-6 items-center">

      <!-- User ID Input -->
      <div class="font-medium text-sm">User ID</div>
      <div class="w-full max-w-md">
        <label class="input input-bordered input-sm flex items-center gap-2">
          <input type="text" class="grow font-mono text-xs" placeholder="12345a6b-c78d-..." [(ngModel)]="userId" />
        </label>
      </div>

      <!-- Area Selection Group -->
      <div class="font-medium text-sm">Target Area</div>
      <div class="flex flex-row join w-full max-w-md">
        <select class="select select-bordered select-sm join-item w-1/2" [(ngModel)]="areaType"
                (change)="selectAreaType(areaType()!)">
          @for (at of areaTypes; track at.name) {
            <option [value]="at.name">{{ at.name }}</option>
          }
        </select>
        <select class="select select-bordered select-sm join-item w-1/2" [(ngModel)]="area"
                (change)="selectArea(area()!)">
          @for (ar of areas; track ar.name) {
            <option [value]="ar.name">{{ ar.name }}</option>
          }
        </select>
      </div>

    </div>

    <!-- Divider -->
    <div class="divider my-8"></div>

    <!-- Actions Section -->
    <div class="flex items-center gap-3">
      <button
        [disabled]="userId() === '' || area() === '' || loadingUserAreaMapping"
        class="btn btn-primary btn-sm"
        (click)="createUserAreaMapping()">
        @if (loadingUserAreaMapping) {
          <span class="loading loading-spinner loading-xs"></span>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 21.0002L7 21M17 21.0002L17.8031 21C18.921 21 19.48 21 19.9074 20.7822C20.2837 20.5905 20.5905 20.2843 20.7822 19.908C21 19.4806 21 18.921 21 17.8031V9.21955C21 8.77072 21 8.54521 20.9521 8.33105C20.9095 8.14 20.8393 7.95652 20.7432 7.78595C20.6366 7.59674 20.487 7.43055 20.1929 7.10378L17.4377 4.04241C17.0969 3.66374 16.9242 3.47181 16.7168 3.33398C16.5303 3.21 16.3242 3.11858 16.1073 3.06287C15.8625 3 15.5998 3 15.075 3H6.2002C5.08009 3 4.51962 3 4.0918 3.21799C3.71547 3.40973 3.40973 3.71547 3.21799 4.0918C3 4.51962 3 5.08009 3 6.2002V17.8002C3 18.9203 3 19.4796 3.21799 19.9074C3.40973 20.2837 3.71547 20.5905 4.0918 20.7822C4.5192 21 5.07899 21 6.19691 21H7M17 21.0002V17.1969C17 16.079 17 15.5192 16.7822 15.0918C16.5905 14.7155 16.2837 14.4097 15.9074 14.218C15.4796 14 14.9203 14 13.8002 14H10.2002C9.08009 14 8.51962 14 8.0918 14.218C7.71547 14.4097 7.40973 14.7155 7.21799 15.0918C7 15.5196 7 16.0801 7 17.2002V21M15 7H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
        Create Mapping
      </button>

      <button class="btn btn-ghost btn-sm" type="button" (click)="onCancel()">
        Clear / Reset
      </button>
    </div>

  </div>
</div>
