<div class="w-full max-w-4xl flex flex-col gap-6">

  <!-- Header Section -->
  <div>
    <h2 class="text-xl font-semibold text-base-content">
      User-Area Mapping
    </h2>

    <p class="text-xs text-secondary mt-1">
      Assign system users to specific geographical areas or operational zones.
    </p>
  </div>

  <!-- Main Content -->
  <div class="flex flex-col gap-6 p-6 border border-base-300 rounded-lg bg-base-100">

    <div>
      <h3 class="text-lg font-semibold">
        Map User to an Area
      </h3>

      <p class="text-xs text-secondary mt-1">
        Select a user and assign the relevant operational area.
      </p>
    </div>

    <!-- Form -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">

      <!-- User ID -->
      <label class="form-control w-full">
        <div class="label">
          <span class="label-text text-xs font-medium">
            User ID
          </span>
        </div>

        <input
          type="text"
          class="input input-bordered input-sm w-full font-mono text-xs"
          placeholder="12345a6b-c78d-..."
          [(ngModel)]="userId"
        />
      </label>

      <!-- Area Type -->
      <label class="form-control w-full">

        <div class="label">
          <span class="label-text text-xs font-medium">
            Area Type
          </span>
        </div>

        <select
          class="select select-bordered select-sm w-full"
          [(ngModel)]="areaType"
          (change)="selectAreaType(areaType()!)">
          @for (at of areaTypes; track at.name) {

            <option [value]="at.name">
              {{at.name}}
            </option>

          }
        </select>
      </label>

      <!-- Area -->
      <label class="form-control w-full sm:col-span-2">

        <div class="label">
          <span class="label-text text-xs font-medium">
            Target Area
          </span>
        </div>

        <select
          class="select select-bordered select-sm w-full max-w-md"
          [(ngModel)]="area"
          (change)="selectArea(area()!)">
          @for (ar of areas; track ar.name) {

            <option [value]="ar.name">
              {{ar.name}}
            </option>

          }
        </select>
      </label>
    </div>

    <!-- Actions -->
    <div class="mt-4 flex gap-3">
      <button
        class="btn btn-primary btn-sm"
        [disabled]="userId() === '' || area() === '' || loadingUserAreaMapping"
        (click)="createUserAreaMapping()">
        <span
          [hidden]="!loadingUserAreaMapping"
          class="loading loading-spinner loading-xs">
        </span>
        <span [hidden]="loadingUserAreaMapping">
          <svg
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none">

            <path
              d="M12 8V16M8 12H16M12 21C7.02944 21 3 16.9706 3 12C3 7.02944 7.02944 3 12 3C16.9706 3 21 16.9706 21 12C21 16.9706 16.9706 21 12 21Z"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"/>
          </svg>
        </span>
        Create Mapping
      </button>



      <button
        class="btn btn-ghost btn-sm"
        type="button"
        (click)="onCancel()">
        Clear
      </button>
    </div>

  </div>
</div>
