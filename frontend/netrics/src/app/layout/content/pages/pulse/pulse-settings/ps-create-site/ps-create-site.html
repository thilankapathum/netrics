<div class="w-full max-w-3xl flex flex-col">
  <!-- Header -->
  <h2 class="text-2xl font-bold mb-6">Create Site</h2>

  <!-- Mode Selection Tabs -->
  <div role="tablist" class="tabs tabs-bordered mb-8 w-fit">
    <button role="tab" class="tab"
            [class.tab-active]="!createMultipleSites()"
            (click)="createMultipleSites.set(false)">
      Single Site
    </button>
    <button role="tab" class="tab"
            [class.tab-active]="createMultipleSites()"
            (click)="createMultipleSites.set(true)">
      Bulk Upload (JSON)
    </button>
  </div>

  <!-- View: Single Site -->
  @if (!createMultipleSites()) {
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">

      <label class="form-control w-full">
        <div class="label"><span class="label-text font-medium">Site ID</span></div>
        <input type="text" placeholder="KYKAN1" class="input input-bordered w-full"
               [(ngModel)]="siteCode" [disabled]="creatingSite()" />
      </label>

      <label class="form-control w-full">
        <div class="label"><span class="label-text font-medium">Site Name</span></div>
        <input type="text" placeholder="Kandy 1" class="input input-bordered w-full"
               [(ngModel)]="siteName" [disabled]="creatingSite()" />
      </label>

      <label class="form-control w-full">
        <div class="label"><span class="label-text font-medium">Latitude</span></div>
        <input type="number" placeholder="8.12345" class="input input-bordered w-full"
               [(ngModel)]="latitude" [disabled]="creatingSite()" />
      </label>

      <label class="form-control w-full">
        <div class="label"><span class="label-text font-medium">Longitude</span></div>
        <input type="number" placeholder="81.1234" class="input input-bordered w-full"
               [(ngModel)]="longitude" [disabled]="creatingSite()" />
      </label>

    </div>

    <!-- Actions -->
    <div class="mt-8 flex gap-3">
      <button class="btn btn-primary"
              [disabled]="creatingSite() || !isInputsValid() || !hasAnyRole(['PULSE_CREATE'])"
              (click)="createSite()">
        @if (creatingSite()) {
          <span class="loading loading-spinner loading-sm"></span>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 21.0002L7 21M17 21.0002L17.8031 21C18.921 21 19.48 21 19.9074 20.7822C20.2837 20.5905 20.5905 20.2843 20.7822 19.908C21 19.4806 21 18.921 21 17.8031V9.21955C21 8.77072 21 8.54521 20.9521 8.33105C20.9095 8.14 20.8393 7.95652 20.7432 7.78595C20.6366 7.59674 20.487 7.43055 20.1929 7.10378L17.4377 4.04241C17.0969 3.66374 16.9242 3.47181 16.7168 3.33398C16.5303 3.21 16.3242 3.11858 16.1073 3.06287C15.8625 3 15.5998 3 15.075 3H6.2002C5.08009 3 4.51962 3 4.0918 3.21799C3.71547 3.40973 3.40973 3.71547 3.21799 4.0918C3 4.51962 3 5.08009 3 6.2002V17.8002C3 18.9203 3 19.4796 3.21799 19.9074C3.40973 20.2837 3.71547 20.5905 4.0918 20.7822C4.5192 21 5.07899 21 6.19691 21H7M17 21.0002V17.1969C17 16.079 17 15.5192 16.7822 15.0918C16.5905 14.7155 16.2837 14.4097 15.9074 14.218C15.4796 14 14.9203 14 13.8002 14H10.2002C9.08009 14 8.51962 14 8.0918 14.218C7.71547 14.4097 7.40973 14.7155 7.21799 15.0918C7 15.5196 7 16.0801 7 17.2002V21M15 7H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
        Create Site
      </button>

      <!-- Optional clear button if user wants to wipe the form -->
      <button class="btn btn-ghost" type="button" [disabled]="creatingSite()" (click)="resetForm()">
        Clear
      </button>
    </div>
  }

  <!-- View: Bulk Upload JSON -->
  @if (createMultipleSites()) {
    <div class="form-control w-full">
      <div class="label">
        <span class="label-text font-medium">Site List JSON</span>
      </div>
      <textarea [(ngModel)]="siteListJson"
                [disabled]="creatingSites()"
                class="textarea textarea-bordered h-64 w-full font-mono text-sm shadow-inner"
                placeholder='[&#10;  {&#10;    "siteCode": "KYKAN1",&#10;    "siteName": "Kandy 1",&#10;    "latitude": 8.123,&#10;    "longitude": 81.123&#10;  }&#10;]'></textarea>
    </div>

    <!-- Actions -->
    <div class="mt-8 flex gap-3">
      <button class="btn btn-primary"
              [disabled]="creatingSites() || !isJsonInputValid() || !hasAnyRole(['PULSE_CREATE'])"
              (click)="createSiteList(siteListJson())">
        @if (creatingSites()) {
          <span class="loading loading-spinner loading-sm"></span>
        } @else {
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M17 21.0002L7 21M17 21.0002L17.8031 21C18.921 21 19.48 21 19.9074 20.7822C20.2837 20.5905 20.5905 20.2843 20.7822 19.908C21 19.4806 21 18.921 21 17.8031V9.21955C21 8.77072 21 8.54521 20.9521 8.33105C20.9095 8.14 20.8393 7.95652 20.7432 7.78595C20.6366 7.59674 20.487 7.43055 20.1929 7.10378L17.4377 4.04241C17.0969 3.66374 16.9242 3.47181 16.7168 3.33398C16.5303 3.21 16.3242 3.11858 16.1073 3.06287C15.8625 3 15.5998 3 15.075 3H6.2002C5.08009 3 4.51962 3 4.0918 3.21799C3.71547 3.40973 3.40973 3.71547 3.21799 4.0918C3 4.51962 3 5.08009 3 6.2002V17.8002C3 18.9203 3 19.4796 3.21799 19.9074C3.40973 20.2837 3.71547 20.5905 4.0918 20.7822C4.5192 21 5.07899 21 6.19691 21H7M17 21.0002V17.1969C17 16.079 17 15.5192 16.7822 15.0918C16.5905 14.7155 16.2837 14.4097 15.9074 14.218C15.4796 14 14.9203 14 13.8002 14H10.2002C9.08009 14 8.51962 14 8.0918 14.218C7.71547 14.4097 7.40973 14.7155 7.21799 15.0918C7 15.5196 7 16.0801 7 17.2002V21M15 7H9" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        }
        Create Sites
      </button>

      <button class="btn btn-ghost" type="button" [disabled]="creatingSites()" (click)="resetForm()">
        Clear
      </button>
    </div>
  }

</div>
