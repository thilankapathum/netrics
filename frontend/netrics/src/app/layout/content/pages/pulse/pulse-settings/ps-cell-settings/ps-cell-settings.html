<div class="flex flex-col gap-4 w-full max-w-5xl">

  <div>
    <h2 class="text-base font-semibold text-base-content">Cell Information</h2>
    <p class="text-xs text-secondary mt-0.5">
      @if (missingCellInfoCount() > 0) {
        <span class="text-error font-semibold">{{ missingCellInfoCount() }}</span> cells are missing information.
      } @else {
        All cells have complete information.
      }
    </p>
  </div>

  <div class="grid grid-cols-1 lg:grid-cols-2 gap-3">

    <!-- Download -->
    <section class="flex flex-col gap-3 p-4 rounded-xl border border-base-300 bg-base-100">
      <div>
        <h3 class="text-sm font-semibold">Download</h3>
        <p class="text-xs text-secondary mt-0.5">Export cells as CSV to review or correct offline.</p>
      </div>
      <div class="flex flex-wrap items-center gap-2">
        <button class="btn btn-sm" [disabled]="loadingMissingCellInfoDownload" (click)="exportCellsWithMissingInfo()">
          @if (loadingMissingCellInfoDownload) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4V16M12 16L8 12M12 16L16 12M4 20H20"/></svg>
          }
          Missing information
        </button>
        <button class="btn btn-sm" [disabled]="loadingAllCellsDownload" (click)="exportAllCells()">
          @if (loadingAllCellsDownload) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 4V16M12 16L8 12M12 16L16 12M4 20H20"/></svg>
          }
          All cells
        </button>
      </div>
    </section>

    <!-- Upload -->
    <section class="flex flex-col gap-3 p-4 rounded-xl border border-base-300 bg-base-100">
      <div>
        <h3 class="text-sm font-semibold">Upload corrections</h3>
        <p class="text-xs text-secondary mt-0.5">Upload the corrected CSV to update cell information.</p>
      </div>
      <input [disabled]="loadingMissingCellInfoUpload" #cellMissingInfoFileInput type="file" accept=".csv" class="file-input file-input-sm w-full" [attr.aria-label]="'Corrected cell CSV'"/>
      <div class="flex items-center gap-2">
        <button class="btn btn-sm btn-primary" [disabled]="loadingMissingCellInfoUpload" (click)="importCellsWithCorrectedInfo(cellMissingInfoFileInput)">
          @if (loadingMissingCellInfoUpload) {
            <span class="loading loading-spinner loading-xs"></span>
          } @else {
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 16V4M12 4L8 8M12 4L16 8M4 20H20"/></svg>
          }
          Upload corrections
        </button>
      </div>
    </section>

  </div>

</div>
