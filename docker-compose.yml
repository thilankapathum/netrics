#version: '3.8'

networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  postgres_data:

services:

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "8032:${POSTGRES_PORT}"
    networks:
      - private_net
      - public_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  netrics_mysql:
    image: mysql
    container_name: netrics_mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    command: --max_allowed_packet=256M
    ports:
      - "8006:3306"
#    expose:
#      - "${MYSQL_PORT}"
    volumes:
      - mysql_data:/var/lib/mysql
      #- ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass" ]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private_net
      - public_net
    restart: unless-stopped

  config-server:
    image: thilankaw/netrics/config-server:0.0.1
    expose:
      - "8003"
    environment:
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - DISCOVERY_HOST=${DISCOVERY_HOST}
    depends_on:
      netrics_mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8003/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private_net

  discovery:
    image: thilankaw/netrics/discovery:0.0.1
    expose:
      - "8761"
    environment:
      - DISCOVERY_HOST=${DISCOVERY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - private_net
    restart: unless-stopped

  gateway:
    image: thilankaw/netrics/gateway:0.0.1
    ports:
      - "8001:8001"
    expose:
      - "9001"
    environment:
      - GATEWAY_HOST=${GATEWAY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - DISCOVERY_HOST=${DISCOVERY_HOST}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9001/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      discovery:
        condition: service_healthy
      netrics-pulse:
        condition: service_healthy
    networks:
      - private_net
      - public_net

  netrics-pulse:
    image: thilankaw/netrics/pulse:0.0.1
    environment:
      - MYSQL_HOST=${MYSQL_HOST}
      - MYSQL_PORT=${MYSQL_PORT}
      - MYSQL_DATABASE=${MYSQL_DATABASE}
      - MYSQL_USER=${MYSQL_USER}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD}
      - NETRICS_PULSE_HOST=${NETRICS_PULSE_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - DISCOVERY_HOST=${DISCOVERY_HOST}
    expose:
      - "8012"
      - "9012"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9012/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      netrics_mysql:
        condition: service_healthy
      discovery:
        condition: service_healthy
    networks:
      - private_net

  kpi_processor_ltefdd_day:
    image: thilankaw/netrics/kpi-processor-ltefdd-day:0.0.2
    container_name: kpi_processor_ltefdd_day
    env_file:
      - .env
    depends_on:
      netrics_mysql:
        condition: service_healthy
      netrics-pulse:
        condition: service_healthy
    volumes:
#      - ./backend/python/pulse/files/day-average/ltefdd/ftp:/app/day-average/ltefdd/ftp
#      - ./backend/python/pulse/files/day-average/ltefdd/processed:/app/day-average/ltefdd/processed
#      - ./backend/python/pulse/files/day-average/ltefdd/temp:/app/day-average/ltefdd/temp
#      - ./backend/python/pulse/files/day-average/ltefdd/logs:/app/day-average/ltefdd/logs
#      - ./backend/python/pulse/config-ltefdd-day.json:/app/config-ltefdd-day.json
      - /home/ftpuser/THILANKAW/netrics/backend/python/pulse/files/day-average/ltefdd/ftp:/app/day-average/ltefdd/ftp
      - /home/ftpuser/THILANKAW/netrics/backend/python/pulse/files/day-average/ltefdd/processed:/app/day-average/ltefdd/processed
      - /home/ftpuser/THILANKAW/netrics/backend/python/pulse/files/day-average/ltefdd/temp:/app/day-average/ltefdd/temp
      - /home/ftpuser/THILANKAW/netrics/backend/python/pulse/files/day-average/ltefdd/logs:/app/day-average/ltefdd/logs
      - /home/ftpuser/THILANKAW/netrics/backend/python/pulse/files/day-average/ltefdd/config-ltefdd-day.json:/app/config-ltefdd-day.json
    networks:
      - private_net

  netrics-frontend:
    container_name: netrics-frontend
    image: thilankaw/netrics/frontend:0.0.1
    ports:
      - 8000:80   # Remember to Enable CORS in BeansConfig for localhost:4200
    networks:
      - public_net
    depends_on:
      gateway:
        condition: service_healthy