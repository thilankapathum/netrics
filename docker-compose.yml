networks:
  public_net:
    driver: bridge
  private_net:
    driver: bridge
    internal: true

volumes:
  mysql_data:
  postgres_data:
  redis-data:
  pgadmin:

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_PULSE}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - postgres_data:/var/lib/postgresql/data
#    ports:
#      - "8032:5432"
    expose:
      - "${POSTGRES_PORT}"
    networks:
      - private_net
#      - public_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pguser -d pulse_db"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  pgadmin:
    container_name: pgadmin
    image: dpage/pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-pgadmin@pgadmin.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'True'

      PGADMIN_CONFIG_FORCE_SCRIPT_NAME: "'/pgadmin'"
      PGADMIN_CONFIG_PROXY_X_HOST: "'${DOMAIN_IP}'"
      PGADMIN_CONFIG_PROXY_X_PORT: "'${FRONTEND_PORT}'"
    volumes:
      - pgadmin:/var/lib/pgadmin
    expose:
      - "80"
#    ports:
#      - "8033:80"
    networks:
#      - public_net
      - private_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost/misc/ping').read()" ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: redis
#    ports:
#      - "6379:6379"
    expose:
      - "6379"
    command: ["redis-server", "--save", "60", "1"]
    volumes:
      - redis-data:/data
    networks:
      - private_net
#      - public_net
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.2
    container_name: keycloak
    command:
      - start
      - --proxy=edge
      - --hostname-strict=false
      - --hostname-strict-https=false
      - --http-enabled=true
      - --http-relative-path=/auth
      - --proxy-headers=xforwarded
      - --hostname-url=http://${DOMAIN_IP}:${FRONTEND_PORT}/auth
      - --hostname-admin-url=http://${DOMAIN_IP}:${FRONTEND_PORT}/auth
    environment:
      # Database Configuration
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB_KEYCLOAK}   # Configure database in PGADMIN before initiating keycloak
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}

      # Admin Console Configuration
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-password}

      # Proxy Configuration (for nginx reverse proxy)
      KC_PROXY: edge
      KC_HOSTNAME_STRICT: 'false'
      KC_HTTP_ENABLED: 'true'
      KC_PROXY_HEADERS: xforwarded
      KC_HOSTNAME_URL: http://${DOMAIN_IP}:${FRONTEND_PORT}/auth
      KC_HOSTNAME_ADMIN_URL: http://${DOMAIN_IP}:${FRONTEND_PORT}/auth

      # Frontchannel logout
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'false'

      # Performance Tuning
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'

      # Logging
      KC_LOG_LEVEL: INFO

      # Cache Configuration (for production clustering)
      KC_CACHE: ispn
      KC_CACHE_STACK: tcp

    expose:
      - "8080"
    volumes:
      - ./keycloak/themes:/opt/keycloak/themes
      - ./keycloak/providers:/opt/keycloak/providers
    networks:
      - public_net
      - private_net
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e 'GET /auth/health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n' >&3;if [ $? -eq 0 ]; then echo 'Healthcheck Successful';exit 0;else echo 'Healthcheck Failed';exit 1;fi;" ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    restart: unless-stopped


  config-server:
    image: thilankaw/netrics/config-server:0.0.3
    expose:
      - "8003"
    environment:
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - DISCOVERY_HOST=${DISCOVERY_HOST}
      - KEYCLOAK_HOST=${KEYCLOAK_HOST}
      - KEYCLOAK_PORT=${KEYCLOAK_PORT}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8003/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - private_net

  discovery:
    image: thilankaw/netrics/discovery:0.0.1
    expose:
      - "8761"
    environment:
      - DISCOVERY_HOST=${DISCOVERY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:8761/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      config-server:
        condition: service_healthy
    networks:
      - private_net
    restart: unless-stopped

  gateway:
    image: thilankaw/netrics/gateway:0.0.2
    ports:
      - "8001:8001"
    expose:
      - "9001"
#      - "8001"
    environment:
      - GATEWAY_HOST=${GATEWAY_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - DISCOVERY_HOST=${DISCOVERY_HOST}
      - KEYCLOAK_HOST=${KEYCLOAK_HOST}
      - KEYCLOAK_PORT=${KEYCLOAK_PORT}
      - DOMAIN_IP=${DOMAIN_IP}
      - FRONTEND_PORT=${FRONTEND_PORT}
    extra_hosts:
      - "${DOMAIN_IP}:host-gateway"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9001/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      discovery:
        condition: service_healthy
      pulse:
        condition: service_healthy
      nginx:
        condition: service_healthy
    networks:
      - private_net
      - public_net

  pulse:
    image: thilankaw/netrics/pulse:0.0.5
    environment:
      - POSTGRES_HOST=${POSTGRES_HOST}
      - POSTGRES_PORT=${POSTGRES_PORT}
      - POSTGRES_DB_PULSE=${POSTGRES_DB_PULSE}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - PULSE_HOST=${PULSE_HOST}
      - CONFIG_SERVER_HOST=${CONFIG_SERVER_HOST}
      - DISCOVERY_HOST=${DISCOVERY_HOST}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - KEYCLOAK_HOST=${KEYCLOAK_HOST}
      - KEYCLOAK_PORT=${KEYCLOAK_PORT}
      - DOMAIN_IP=${DOMAIN_IP}
      - FRONTEND_PORT=${FRONTEND_PORT}
    expose:
      - "8012"
      - "9012"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost:9012/actuator/health" ]
      interval: 10s
      timeout: 3s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery:
        condition: service_healthy
    networks:
      - private_net

  kpip-day:
    image: thilankaw/netrics/kpip-day:0.0.5
    container_name: kpip-day
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      pulse:
        condition: service_healthy
    volumes:
#      - ./backend/python/pulse/files/day-average:/app/day-average
      - /home/ftpuser/THILANKAW/netrics/backend/python/pulse/files/day-average:/app/day-average
    networks:
      - private_net

  frontend:
    container_name: frontend
    image: thilankaw/netrics/frontend:0.0.5
    expose:
      - "80"
    networks:
      - public_net
    depends_on:
      keycloak:
        condition: service_healthy
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost/ || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  nginx:
    container_name: nginx
    image: thilankaw/netrics/nginx:0.0.1
    ports:
      - "8000:8000"   # Remember to Enable CORS in BeansConfig for localhost:4200
    networks:
      - public_net
      - private_net
    depends_on:
      keycloak:
        condition: service_healthy
      frontend:
        condition: service_healthy
      pgadmin:
        condition: service_healthy
    environment:
      - DOMAIN_IP=${DOMAIN_IP}
    healthcheck:
      test: [ "CMD-SHELL", "curl -fs http://localhost:8000/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s