spring:
  cloud:
    gateway:
      server:
        webflux:
          discovery:
            locator:
              enabled: true
          routes:
            - id: pulse-service
              uri: lb:http://PULSE-SERVICE
              predicates:
                - Path=/api/v1/pulse/**
          globalcors:
            cors-configurations:
              '[/**]':
                allowedOrigins:
                  - "http://172.19.95.160:4200"
                  - "http://172.19.95.160:8000"
                  - "http://localhost:4200"
                  - "http://localhost:8000"
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
                allowedHeaders:
                  - "*"
                allowCredentials: true
                maxAge: 3600  # Cache preflight response for 1 hour
server:
  port: 8001

eureka:
  instance:
    prefer-ip-address: true #To force Eureka to use host IP address instead of PC Name
  client:
    serviceUrl:
      defaultZone: http://${DISCOVERY_HOST:localhost}:8761/eureka/

management:   # Configurations for Actuator
  endpoints:
    web:
      exposure:
        include: health,info # only expose safe endpoints
  endpoint:
    health:
      show-details: never # don’t leak DB status, etc.
  server:
    port: 9001 # separate internal port for actuator