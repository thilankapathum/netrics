user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    # Performance Optimization
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # Rate Limiting
#     limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
#     limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/s;

    resolver 127.0.0.11 valid=30s;


    # Upstream Definitions
    upstream backend_gateway {
        zone backend_gateway 64k;  # Required for dynamic resolution
#         server 172.19.95.160:8001 max_fails=3 fail_timeout=30s;
#         server gateway:8001 max_fails=3 fail_timeout=30s;
        server gateway:8001 resolve;
#         server localhost:8001 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    upstream keycloak_server {
        server keycloak:8080 max_fails=3 fail_timeout=30s;
        keepalive 16;
    }

#     upstream angular_frontend{
#         zone backend_gateway 64k;  # Required for dynamic resolution
#         server frontend:4200 resolve;
#         keepalive 64;
#     }

    server {
        listen 8000;
        server_name localhost netrics.local;
#         server_name 172.19.95.160;

        # Security: Hide nginx version
        server_tokens off;

        # Root location for Angular Frontend
        location / {
#             root /usr/share/nginx/html;
#             try_files $uri $uri/ /index.html;

#             proxy_pass http://angular_frontend/;

            # Proxy Headers
#             proxy_set_header Host $host;
#             proxy_set_header X-Real-IP $remote_addr;
#             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
#             proxy_set_header X-Forwarded-Proto $scheme;
#             proxy_set_header X-Forwarded-Host $host;
#             proxy_set_header X-Forwarded-Port $server_port;
#
            # Cache static assets
#             location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
# #                 proxy_pass http://angular_frontend/;
#                 expires 1y;
#                 add_header Cache-Control "public, immutable";
#             }

#
#             # No cache for index.html
#             location = /index.html {
#                 add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
#                 expires off;
#             }
        }

        # Backend API Gateway
        location /api/ {
#             limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://backend_gateway/api/;

            # Proxy Headers
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Port $server_port;

            # Timeouts
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 4k;
            proxy_buffers 8 4k;

            # HTTP/1.1 support
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            # CORS Headers (if needed, adjust origins)
            add_header Access-Control-Allow-Origin http://localhost:8000 always;
#             add_header Access-Control-Allow-Origin http://172.19.95.160:8000 always;
            add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, PATCH, OPTIONS" always;
            add_header Access-Control-Allow-Headers "Authorization, Content-Type, Accept, Origin, X-Requested-With" always;
            add_header Access-Control-Allow-Credentials "true" always;

            # Handle preflight
            if ($request_method = OPTIONS) {
                return 204;
            }
        }

        # Keycloak Authentication Service
        location /auth/ {
#             limit_req zone=auth_limit burst=10 nodelay;

            proxy_pass http://keycloak_server/auth/;

            # Proxy Headers
            proxy_set_header Host $host:$server_port;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host:$server_port;
            proxy_set_header X-Forwarded-Port $server_port;

            # Important for Keycloak redirects
            proxy_set_header X-Forwarded-Prefix /auth;

            # Timeouts (higher for admin operations)
            proxy_connect_timeout 90s;
            proxy_send_timeout 90s;
            proxy_read_timeout 90s;

            # Buffering
            proxy_buffering on;
            proxy_buffer_size 8k;
            proxy_buffers 16 8k;

            # HTTP/1.1 support
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Upgrade $http_upgrade;

            # CORS for Keycloak
            add_header Access-Control-Allow-Origin http://localhost:4200 always;
#             add_header Access-Control-Allow-Origin http://localhost:4200 always;
#             add_header Access-Control-Allow-Origin http://172.19.95.160:8000 always;
            add_header Access-Control-Allow-Credentials "true" always;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Deny access to hidden files
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
        }
    }
}